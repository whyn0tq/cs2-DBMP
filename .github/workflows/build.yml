name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload the package to
        required: false
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout DBMP
        uses: actions/checkout@v4

      - name: Checkout Metamod:Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: deps/metamod-source
          submodules: recursive

      - name: Checkout CS2 SDK
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/s2sdk
          ref: cs2
          path: deps/hl2sdk-cs2

      - name: Build package
        run: |
          docker build -t dbmp-builder .
          mkdir -p out
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$GITHUB_WORKSPACE/out:/out" \
            -v "$GITHUB_WORKSPACE/deps/metamod-source:/deps/metamod-source" \
            -v "$GITHUB_WORKSPACE/deps/hl2sdk-cs2:/deps/hl2sdk-cs2" \
            dbmp-builder

      - name: Create archive
        id: package
        run: |
          version=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          archive="$GITHUB_WORKSPACE/out/DBMP-${version}-linux-x86_64.zip"
          cd out/package
          zip -qr "$archive" addons
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DBMP-linux-x86_64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ steps.package.outputs.archive }}
          overwrite_files: true
